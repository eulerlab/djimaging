[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "djimaging"
version = "1.2.0"
description = "DataJoint for 2P imaging data"
authors = [{ name = "Jonathan Oesterle", email = "jonathan.oesterle@uni-tuebingen.de" }]
requires-python = ">=3.10"
dependencies = [
    "datajoint>=2.3.1,<2.4",
    # The converted classifier pickle references numpy._core.numeric (NumPy 2).
    "numpy>=2.0.0",
    # Compiled dependencies must support the NumPy 2 ABI.
    "h5py>=3.11.0",
    "scipy>=1.13.0",
    "cached_property>=1.5.2",
    "matplotlib>=3.8.4",
    "pandas>=2.2.2",
    "seaborn>=0.13.2",
    # Saved classifiers additionally require their exact scikit-learn version.
    "scikit-learn>=1.7.2",
    "opencv-python>=4.10.0.84",
    "astropy>=6.1.0",
    "ipython>=8.12.3",
    "numba>=0.60.0",
    "scanm-support>=0.0.1",
]

[project.optional-dependencies]
autorois = [
    "pytorch_lightning>=2.4.0",
    "torch>=2.4.1",
    "ipywidgets>=8.0.0",
    "ipycanvas>=0.13.0",
]
rf = [
    "rfest>=2.1.2",
]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
markers = ["dependency: mark a test as a dependency"]
filterwarnings = [
    "error:fetch\\(\\) is deprecated.*:DeprecationWarning",
    "error:ERD is deprecated.*:DeprecationWarning",
]

[tool.uv]
# Minimum patched versions for transitive dependencies with security advisories.
constraint-dependencies = [
    "pillow>=12.3.0",
    "aiohttp>=3.14.3",
    "idna>=3.15",
]

[tool.uv.sources]
scanm-support = { git = "https://github.com/eulerlab/ScanM_support.git" }
